[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/dave/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/dave/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true

[tui]
notifications = false
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[features]
daemon_auto_start = false
multi_agent = false
goals = false

[profiles.openai]
model = "gpt-6.1-sol"
model_provider = "openai"
model_reasoning_effort = "medium"
service_tier = "fast"

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com/"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

[model_providers.zai]
name = "Z.ai"
base_url = "https://api.z.ai/api/paas/v4"
env_key = "ZAI_API_KEY"
wire_api = "responses"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
wire_api = "responses"
experimental_bearer_token = "REPLACE_WITH_YOUR_OPENROUTER_KEY"
# Send the Codex session id as the OpenRouter `session_id` body field. OpenRouter
# uses it as a sticky-routing key, so a conversation keeps hitting the same
# upstream provider (and its warm prompt cache) between turns.
send_session_id = true

# Extra top-level body fields merged into every request. OpenRouter `provider`
# preferences control upstream routing; tool calls always use Exacto routing.
# Edit here (no rebuild needed). See https://openrouter.ai/docs/provider-routing
[model_providers.openrouter.extra_body.provider]
allow_fallbacks = true
