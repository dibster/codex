# Native Codex install + multi-model workflow patch.
# Central workflow/model mapping lives in ~/.codex/workflows.toml.
# Default session runs the OpenRouter multi-model workflow (workflows.toml).
# Native OpenAI models remain available via:  codex --profile openai
model = "deepseek/deepseek-v4.1-flash"
model_provider = "openrouter"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "max"
model_catalog_json = "/home/dave/.codex/models.workflow.json"
check_for_update_on_startup = false

# Capacity/compaction controls, not a hard request-token or billing cap.
model_context_window = 270000
model_auto_compact_token_limit = 200000
model_auto_compact_token_limit_scope = "total"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
project_doc_fallback_filenames = ["agents.md"]
approvals_reviewer = "user"

[agents]
enabled = false
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2

[mcp_servers.chrome-devtools]
command = "/home/dave/.local/bin/chrome-devtools-per-repo"
args = []

[mcp_servers.chrome-devtools.tools.click]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.evaluate_script]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.fill]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.press_key]
approval_mode = "approve"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/dave/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/dave/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.903.71938"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/dave/.codex/plugins/cache/openai-bundled/browser/26.903.71938/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

